<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ver pedidos — ThaXu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--azul:#2A4B99;--azul-osc:#1F3A7A;--amarillo:#F2A900;--fondo:#E6EAEF;--texto:#1B2333;--borde:#D5DAE1;--verde:#2E7D4F;--rojo:#C0392B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo:#161B26;--texto:#E8ECF3;--borde:#343C4D}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:800px;margin:0 auto;padding:0 16px}
.topbar{background:#fff;padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{display:block}
.brand{display:flex;align-items:center;gap:10px;padding:8px 0}
.brand img{height:46px;width:auto}
.brand b{display:block;font-size:15px;color:#1B2333}
.brand span{font-size:12px;color:#5B6472}
nav.tabs{display:flex;border-top:1px solid var(--borde)}
nav.tabs a{flex:1;text-align:center;padding:16px 10px;font-weight:600;font-size:15px;text-decoration:none;color:#5B6472;border-bottom:4px solid transparent}
nav.tabs a:hover{color:var(--azul)}
nav.tabs a.activa{color:#1B2333;border-bottom-color:var(--amarillo)}
.banner{background:#1C2333;border-bottom:6px solid var(--amarillo);color:#fff}
.banner .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:26px;padding-bottom:26px;flex-wrap:wrap}
.banner h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-size:34px;letter-spacing:.5px;text-transform:uppercase}
.banner p{margin:4px 0 0;opacity:.9;font-size:15px}
.meta{font-family:ui-monospace,Consolas,monospace;font-size:12px;text-align:right;line-height:1.7}
.meta small{opacity:.8;display:block}
main{max-width:750px;margin:24px auto;padding:0 16px 40px}
.card{background:#fff;border:1px solid var(--borde);border-left:5px solid var(--azul);padding:22px 26px;margin-bottom:22px;color:#1B2333}
.card.ev{border-left-color:var(--amarillo)}
.card h2{margin:0 0 16px;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.5px}
.card h2 i{font-style:normal;font-family:Inter,sans-serif;font-size:14px;font-weight:500;color:#5B6472;margin-right:10px}
label{display:block;font-size:14px;font-weight:600;color:#3A4A66;margin:0 0 6px}
label em{color:var(--rojo);font-style:normal}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:14px;font:inherit;font-size:16px;border:1px solid var(--borde);background:#FAFAFA;color:#1B2333;border-radius:2px}
textarea{min-height:100px;resize:vertical}
.fila{display:flex;gap:16px;flex-wrap:wrap}.fila>div{flex:1;min-width:200px}.campo{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 18px;border:1px solid var(--borde);background:#fff;font:inherit;font-size:16px;cursor:pointer;color:#1B2333}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.drop{border:1px dashed #B5BCC8;background:#FAFAFA;text-align:center;padding:38px 16px;cursor:pointer;color:#3A4A66;font-size:15px}
.drop .ic{font-size:28px;display:block;margin-bottom:6px}
.drop b{display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.thumb{position:relative;width:84px;height:84px}
.thumb img{width:100%;height:100%;object-fit:cover;border:1px solid var(--borde)}
.thumb button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:none;background:var(--rojo);color:#fff;cursor:pointer;line-height:24px;padding:0}
.btn{display:block;width:100%;padding:20px;border:none;background:var(--amarillo);color:#1B2333;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.msg{padding:14px 16px;margin-bottom:18px;font-size:15px;display:none}
.msg.ok{display:block;background:#E3F4EA;color:#1F6B41;border:1px solid #B5DFC7}
.msg.err{display:block;background:#FBE5E2;color:#8E2A1E;border:1px solid #F0B9B2}
.msg.cfg{display:block;background:#FFF4D6;color:#7A5600;border:1px solid #F0D68A}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.filtros .f{background:#fff;border:1px solid var(--borde);padding:10px 14px;display:flex;align-items:center;gap:8px;color:#1B2333}
.filtros .f b{font-size:15px}
.filtros select{border:none;background:transparent;padding:6px;font-weight:600;color:var(--azul);width:auto;flex:1}
.filtros .full{grid-column:1/-1}
.filtros .full label{margin:4px 0 6px}
.sec{background:#fff;color:#1B2333;border:1px solid var(--borde);padding:10px 16px;font:inherit;cursor:pointer}
#contador{margin:14px 0;font-size:15px}
.aviso{background:#fff;color:#1B2333;border:1px solid var(--borde);border-left:6px solid var(--amarillo);padding:18px 22px;margin-bottom:18px}
.aviso.atendido{border-left-color:var(--verde)}
.aviso .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.aviso .folio{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#5B6472}
.aviso h3{margin:6px 0 8px;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-size:22px;text-transform:uppercase}
.badge{font-size:12px;font-weight:700;padding:5px 12px;letter-spacing:.5px;text-transform:uppercase;background:#FFF0C7;color:#8A5B00}
.atendido .badge{background:#DDF2E5;color:#1F6B41}
.datos{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;margin-bottom:10px}
.datos span b{margin-right:4px}.datos span i{font-style:normal;color:var(--azul)}
.obs{font-size:16px;margin:8px 0 12px}
.fotos{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.fotos a{padding:9px 14px;border:1px solid var(--borde);font-size:14px;color:#1B2333;text-decoration:none;background:#fff}
.acc{text-align:right}
.acc button{padding:10px 18px;border:1px solid #1B2333;background:#fff;color:#1B2333;font:inherit;font-weight:700;cursor:pointer}
.vacio{text-align:center;padding:30px;color:#5B6472}
@media(max-width:560px){.filtros{grid-template-columns:1fr}.banner h1{font-size:28px}.meta{text-align:left}}
.aviso{padding:14px 18px;margin-bottom:12px}
.aviso h3{font-size:20px;margin:6px 0 6px}
.aviso .datos{margin-bottom:6px}
.aviso .obs{font-size:15px;margin:6px 0 10px}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.resumen div{background:#fff;color:#1B2333;border:1px solid var(--borde);border-top:4px solid var(--azul);padding:10px 8px;text-align:center}
.resumen div.p{border-top-color:var(--amarillo)}.resumen div.a{border-top-color:var(--verde)}
.resumen b{display:block;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-size:30px;line-height:1.1}
.resumen span{font-size:12px;color:#5B6472;text-transform:uppercase;letter-spacing:.5px}
.barra{height:8px;background:#fff;border:1px solid var(--borde);margin-bottom:6px}
.barra i{display:block;height:100%;background:var(--verde);width:0}
#avance{font-size:13px;margin-bottom:10px}
</style></head><body>

<div class="banner"><div class="wrap"><div><h1>Visualizador de pedidos</h1><p>Estado de los requerimientos de materiales registrados</p></div></div></div>
<main>
  <div id="msg" class="msg"></div>
  <div class="filtros">
    <div class="f"><b>Estado:</b><select id="fEstado"><option value="">Todos</option><option>Pendiente</option><option>Atendido</option></select></div>
    <div class="f"><b>Técnico:</b><select id="fTec"><option value="">Todos</option></select></div>
    <div class="full"><label for="fDesde">Desde</label><input type="date" id="fDesde"></div>
    <div class="full"><label for="fHasta">Hasta</label><input type="date" id="fHasta"></div>
    <div class="full"><button type="button" class="sec" id="limpiar">Limpiar fechas</button></div>
  </div>
  <div id="contador"></div>
  <div id="lista"></div>
</main>
<script>
(function(){"use strict";
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3BDse6tgsFGZYs7Vm4mkNWiXlLkGd797qRs3ArylKXO3eVc_0iePdosOZWYOAjiMr2w/exec";
var TECNICOS=["Cristhian", "Ismael", "Jaime", "Pablo", "Mauricio", "Viera", "Gian Franco", "Andy", "Victor"];
var $=function(id){return document.getElementById(id)};
var datos=[];
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function msg(t,c){var m=$("msg");m.className="msg "+c;m.textContent=t}
function fmt(f){var m=String(f).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+"/"+m[2]+"/"+m[1]:String(f||"")}
TECNICOS.forEach(function(n){var o=document.createElement("option");o.textContent=n;$("fTec").appendChild(o)});

function pintar(){
 var e=$("fEstado").value,t=$("fTec").value,d1=$("fDesde").value,d2=$("fHasta").value;
 var l=datos.filter(function(r){
  var f=String(r.fecha).slice(0,10);
  return (!e||r.estado===e)&&(!t||String(r.responsable).split(",").map(function(x){return x.trim()}).indexOf(t)>-1)&&(!d1||f>=d1)&&(!d2||f<=d2)});
 var nA=l.filter(function(r){return r.estado==="Atendido"}).length,nP=l.length-nA;
 $("contador").textContent=l.length+" pedido"+(l.length===1?"":"s")+(l.length?" · "+nP+" pendiente"+(nP===1?"":"s")+" · "+nA+" atendido"+(nA===1?"":"s"):"");
 $("lista").innerHTML=l.length?l.map(function(r){
  var at=r.estado==="Atendido";
  var fotos=String(r.imagen||"").split("|").map(function(x){return x.trim()}).filter(Boolean);
  var cod=r.folio?esc(r.folio):"Pedido N.º "+(r.fila-1);
  return '<div class="aviso'+(at?' atendido':'')+'"><div class="top"><div class="folio">'+cod+' · '+esc(fmt(r.fecha))+'</div><span class="badge">'+esc(r.estado)+'</span></div>'+
  '<h3>'+esc(r.material)+'</h3>'+
  '<div class="datos"><span><b>Cantidad:</b><i>'+esc(r.cantidad)+' '+esc(r.unidad)+'</i></span><span><b>Técnico(s):</b><i>'+esc(r.responsable)+'</i></span></div>'+
  (r.observaciones?'<div class="obs">'+esc(r.observaciones)+'</div>':'')+
  (fotos.length?'<div class="fotos">'+fotos.map(function(u,i){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">Ver foto '+(i+1)+'</a>'}).join("")+'</div>':'')+
  '<div class="acc"><button type="button" data-fila="'+r.fila+'" data-nuevo="'+(at?'Pendiente':'Atendido')+'">'+(at?'Reabrir pedido':'Marcar atendido')+'</button></div></div>'
 }).join(""):'<div class="vacio">No hay pedidos para mostrar.</div>'}

function urlOk(){return /^https:\/\/script\.google\.com\/macros\/s\/[^"\s]+\/exec$/.test(APPS_SCRIPT_URL)}
var cargando=false;
function cargar(silencioso){
 if(!urlOk())return msg("⚠️ Falta configurar APPS_SCRIPT_URL en este archivo.","cfg");
 if(cargando)return;cargando=true;
 if(!silencioso&&!datos.length)$("contador").textContent="Cargando...";
 fetch(APPS_SCRIPT_URL+"?accion=listar&t="+Date.now()).then(function(r){return r.json()}).then(function(d){
  if(!Array.isArray(d))throw new Error(d&&d.message?d.message:"Respuesta inesperada del script");
  datos=d;$("msg").className="msg";pintar()})
 .catch(function(e){if(!datos.length)$("contador").textContent="";msg("❌ No se pudo cargar los pedidos ("+e.message+"). Revisa la URL /exec y que la implementación esté en 'Cualquiera'.","err")})
 .finally(function(){cargando=false})}

$("lista").onclick=function(ev){var b=ev.target.closest("button[data-fila]");if(!b)return;
 b.disabled=true;b.textContent="Guardando...";
 fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion:"estado",fila:Number(b.dataset.fila),estado:b.dataset.nuevo})})
 .then(function(r){return r.json()}).then(function(d){
  if(d.result!=="success")throw new Error(d.message);
  datos.forEach(function(r){if(String(r.fila)===b.dataset.fila)r.estado=b.dataset.nuevo});pintar()})
 .catch(function(e){msg("❌ No se pudo actualizar: "+e.message,"err");pintar()})};
["fEstado","fTec","fDesde","fHasta"].forEach(function(i){$(i).addEventListener("change",pintar)});
$("limpiar").onclick=function(){$("fDesde").value="";$("fHasta").value="";pintar()};
cargar();
setInterval(function(){if(!document.hidden)cargar(true)},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)cargar(true)});
})();
</script></body></html>
